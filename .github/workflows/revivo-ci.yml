name: Revivo CI

on:
  push:
    paths: ["revivo/**", ".github/workflows/revivo-ci.yml"]
  pull_request:
    paths: ["revivo/**", ".github/workflows/revivo-ci.yml"]

jobs:
  backend:
    name: Backend (Java 21 · tests unitaires + intégration Testcontainers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revivo/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build & tests
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: revivo/backend/**/target/*-reports/

  frontend:
    name: Frontend (type-check · tests · build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: revivo/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: revivo/frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  docker:
    name: Images Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build des images
        working-directory: revivo
        run: docker compose build
