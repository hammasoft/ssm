# Revivo — stack complète : docker compose up --build
# Front : http://localhost:3000 · Swagger : http://localhost:8081/swagger-ui.html
# Kafka UI : http://localhost:8090 · Mailpit : http://localhost:8025
name: revivo

x-backend-env: &backend-env
  DB_USER: ${POSTGRES_USER:-revivo}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-revivo}
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  JWT_SECRET: ${JWT_SECRET:-cmV2aXZvLWRldi1zZWNyZXQtY2hhbmdlLW1lLWluLXByb2R1Y3Rpb24tcGxlYXNlLTEyMzQ1Njc4OTA=}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-revivo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revivo}
      POSTGRES_DB: postgres
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revivo}"]
      interval: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    ports: ["29092:29092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    ports: ["8090:8080"]
    environment:
      KAFKA_CLUSTERS_0_NAME: revivo
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:latest
    ports: ["8025:8025", "1025:1025"]

  marketplace-service:
    build:
      context: ./backend
      args: { MODULE: marketplace-service }
    environment:
      <<: *backend-env
      DB_URL: jdbc:postgresql://postgres:5432/revivo_marketplace
      DEMO_DATA: ${DEMO_DATA:-true}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports: ["8081:8081"]
    volumes: [uploads:/app/data/uploads]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/8081'"]
      interval: 10s
      retries: 12

  notification-service:
    build:
      context: ./backend
      args: { MODULE: notification-service }
    environment:
      <<: *backend-env
      DB_URL: jdbc:postgresql://postgres:5432/revivo_notifications
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      FRONTEND_URL: http://localhost:3000
    ports: ["8082:8082"]
    depends_on:
      postgres: { condition: service_healthy }
      kafka: { condition: service_healthy }

  frontend:
    build: ./frontend
    ports: ["3000:80"]
    depends_on: [marketplace-service, notification-service]

volumes:
  pgdata:
  uploads:
