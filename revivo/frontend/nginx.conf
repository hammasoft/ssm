# Passerelle unique : sert la SPA et route l'API vers les microservices (même origine → pas de CORS).
server {
    listen 80;
    server_name _;
    client_max_body_size 25m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /usr/share/nginx/html;

    # Flux temps réel SSE : pas de buffering, connexion longue
    location /api/notifications/stream {
        proxy_pass http://notification-service:8082;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/notifications {
        proxy_pass http://notification-service:8082;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~ ^/(api|uploads|swagger-ui|v3/api-docs) {
        proxy_pass http://marketplace-service:8081;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Routage côté client (React Router)
    location / {
        try_files $uri /index.html;
    }
}
